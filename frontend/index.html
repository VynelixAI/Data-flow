<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DataFlow</title>
    <meta name="theme-color" content="#05070d" />
    <script>
      try {
        var savedTheme = localStorage.getItem("dataflow-theme");
        document.documentElement.dataset.theme = savedTheme === "light" ? "light" : "dark";
        document.querySelector('meta[name="theme-color"]').setAttribute(
          "content",
          savedTheme === "light" ? "#f3f6fb" : "#05070d",
        );
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Geist:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
